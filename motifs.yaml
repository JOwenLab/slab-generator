C100_O_methoxyacetone:
  status: pending-literature
  notes: 'Mixed carbonyl+epoxide 1 ML ground state. Source: Lu, Fan, Chen, Mei,
    Ma & Hu, Carbon 159, 9-15 (2020), DOI 10.1016/j.carbon.2019.12.003 (CITATION
    CORRECTED from earlier ''Carbon 162, 510-518''). Methods: CALYPSO + VASP/PBE/PAW,
    600 eV, slab >=8 C layers, O + top 4 layers relaxed, rest fixed. Known metrics:
    C=O 1.18 A, ether/epoxide C-O 1.45 A, Ef -0.63 eV/(1x1) vs ketone, nearest O-O
    5 A, gap 5.27 eV (GW), EA +2.54 eV, phonon-stable; Raman 1100 + 550 cm-1. SI
    checked: figure captions only, NO coordinates. Fig. 1f is a single projection
    with an adatom-bearing, likely non-stoichiometric top layer -- bond graph NOT
    safely inferable; request coordinates from authors (huxj@zjut.edu.cn).'
C111_O_seiwatz_canted:
  status: pending-literature
  notes: 'Seiwatz-chain 1 ML canted O ground state (Sei-1ML-canted, surface formation
    energy -2.64 eV/cell). Source: Yang, Gao & Li, Diam. Relat. Mater. 159, 112823
    (2025), DOI 10.1016/j.diamond.2025.112823. SI checked: figure captions only,
    NO coordinates (''data available on request'' -- email gaon@jlu.edu.cn / hdli@jlu.edu.cn).
    Fig. 6d analysis: polycyclic canted-ribbon structure derived from Sei-0.5ML-canted
    (dissociated surface-C ribbon) + extra O forming C-O single bonds 1.41-1.51
    A; C=O 1.20-1.25 A; occluded projections -- bond graph NOT safely inferable.
    Published: Ef -2.64 eV/unit cell (ground state), gap 1.79 eV with intruding
    O-derived surface levels (paper deems it NV-unfriendly despite stability). SUBSTRATE
    NOTE: Seiwatz single chains live on the TDB (glide-plane, 3db) face -- generator
    currently builds the SDB face only; TDB support required before splicing. Bare-Seiwatz
    reference parameters (Kern, Hafner & Kresse, Surf. Sci. 366, 464 (1996), DFT-LDA):
    chain bond 1.45 A, chain buckling 0.07 A, chain angles 119.4 deg, subsurface
    bucklings 0.04/0.17/0.07/0.02 A, Erel -1.957 eV/atom; monohydrogenated Seiwatz:
    chain 1.525 A, C-H 1.106 A, buckling removed. Also wanted from SI: Sei-1ML-ketone.'
